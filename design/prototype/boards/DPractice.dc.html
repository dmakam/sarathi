<style>

  </header>
  <main style="position: absolute; left: 0; right: 0; top: 60px; bottom: 236px; overflow-y: auto; padding: 22px 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 18px;">
    <p lang="sa" style="margin: 0; font-family: 'Tiro Devanagari Sanskrit', serif; font-size: 28px; line-height: 1.75; text-align: center; text-wrap: balance;"><sc-for list="{{words}}" as="w" hint-placeholder-count="10"><span style="padding: 0 3px; border-radius: 6px; {{w.style}}">{{w.w}}</span> </sc-for></p>
    <sc-if value="{{showSay}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 17px; line-height: 1.55; text-align: center; color: #B9CBC8; text-wrap: balance;">indriy&#257;&#7751;i par&#257;&#7751;y &#257;hur indriyebhya&#7717; para&#7745; mana&#7717;<br>manasas tu par&#257; buddhir yo buddhe&#7717; paratas tu sa&#7717;</p></sc-if>
    <button type="button" onClick="{{toggleSay}}" style="align-self: center; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(244,241,230,0.25); background: none; color: #F4F1E6; font: 600 14.5px Figtree, sans-serif;">{{sayLabel}}</button>
  </main>
  <section style="position: absolute; left: 0; right: 0; bottom: 0; height: 236px; box-sizing: border-box; padding: 16px 20px 30px; border-radius: 26px 26px 0 0; background: #0C2A2F; color: #E4EFEC; display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 16px; font-weight: 600; color: #9DB6B3; text-align: center;">Listen once, then say the whole verse from memory.</p></sc-if>
    <sc-if value="{{isListening}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 16px; font-weight: 700; color: #86CDC2; text-align: center;">Listening&#8230; tap again when you finish</p></sc-if>
    <sc-if value="{{isResult}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: #10353A; border: 1px solid #1F5A5F;"><svg width="20" height="23" viewBox="0 0 40 46" aria-hidden="true"><circle cx="20" cy="15" r="13" fill="#FFC86B" opacity="0.35"></circle><path d="M20 4 C25 11 25 17 20 21 C15 17 15 11 20 4 Z" fill="#F5A623"></path><path d="M20 10 C22.5 13.5 22.5 16.5 20 19 C17.5 16.5 17.5 13.5 20 10 Z" fill="#FFE7A3"></path><path d="M4 24 C4 34 12 40 20 40 C28 40 36 34 36 24 Z" fill="#B5653E"></path><path d="M3 24 H37" stroke="#8C4A2B" stroke-width="2.4" stroke-linecap="round"></path><path d="M14 40 H26 L24 44 H16 Z" fill="#8C4A2B"></path></svg><span style="font-size: 15.5px; font-weight: 800; color: #86CDC2;">Lamp lit &#183; 9 of 10 words clear</span></div></sc-if>
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; gap: 12px;">
      <button type="button" style="justify-self: start; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; color: #E4EFEC; font: 700 13.5px Figtree, sans-serif;"><span style="width: 56px; height: 56px; border-radius: 999px; display: grid; place-items: center; background: #0C2A2F; border: 1px solid #1D4247;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M7 4.5v15l13-7.5z"></path></svg></span>Listen</button>
      <button type="button" onClick="{{tapMic}}" aria-label="{{micLabel}}" style="position: relative; width: 96px; height: 96px; border-radius: 999px; border: 0; background: {{micBg}}; color: #FFFFFF; display: grid; place-items: center; box-shadow: 0 14px 30px -10px rgba(15,82,87,0.7);">
        <sc-if value="{{isListening}}" hint-placeholder-val="{{false}}"><span class="ring" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 999px; border: 3px solid #1F7A72;"></span><span class="ring2" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 999px; border: 3px solid #1F7A72;"></span></sc-if>
        <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
      <sc-if value="{{isResult}}" hint-placeholder-val="{{false}}"><a href="DVerse.dc.html" style="justify-self: end; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #E4EFEC; font-size: 13.5px; font-weight: 700;"><span style="width: 56px; height: 56px; border-radius: 999px; display: grid; place-items: center; background: linear-gradient(180deg, #F6C46A, #E39A35); color: #1C1204;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg></span>Next: 3.43</a></sc-if>
      <sc-if value="{{notResult}}" hint-placeholder-val="{{true}}"><button type="button" style="justify-self: end; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; color: #9DB6B3; font: 700 13.5px Figtree, sans-serif;"><span style="width: 56px; height: 56px; border-radius: 999px; display: grid; place-items: center; background: #0C2A2F; border: 1px solid #1D4247;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>Options</button></sc-if>
    </div>
    <span style="font-size: 14px; font-weight: 700; color: #86CDC2;">{{micText}}</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.state.mode || 'idle';
    const say = this.state.say !== false;
    const words = [{"w": "\u0907\u0928\u094d\u0926\u094d\u0930\u093f\u092f\u093e\u0923\u093f", "close": false}, {"w": "\u092a\u0930\u093e\u0923\u094d\u092f\u093e\u0939\u0941\u0930\u093f\u0928\u094d\u0926\u094d\u0930\u093f\u092f\u0947\u092d\u094d\u092f\u0903", "close": false}, {"w": "\u092a\u0930\u0902", "close": false}, {"w": "\u092e\u0928\u0903\u00a0\u0964", "close": false}, {"w": "\u092e\u0928\u0938\u0938\u094d\u0924\u0941", "close": false}, {"w": "\u092a\u0930\u093e", "close": false}, {"w": "\u092c\u0941\u0926\u094d\u0927\u093f\u0930\u094d\u092f\u094b", "close": true}, {"w": "\u092c\u0941\u0926\u094d\u0927\u0947\u0903", "close": false}, {"w": "\u092a\u0930\u0924\u0938\u094d\u0924\u0941", "close": false}, {"w": "\u0938\u0903\u00a0\u0965", "close": false}].map((x) => ({ w: x.w, style: m === 'result' ? (x.close ? 'background: rgba(233,168,69,0.35); color: #FFE6B0;' : 'background: rgba(31,122,114,0.45); color: #FFFFFF;') : '' }));
    return {
      words,
      isIdle: m === 'idle', isListening: m === 'listening', isResult: m === 'result', notResult: m !== 'result',
      lit: m === 'result', unlit: m !== 'result',
      micBg: m === 'listening' ? '#B04A3A' : '#2A8C82',
      micLabel: m === 'listening' ? 'Stop' : 'Recite',
      micText: m === 'idle' ? 'Tap to recite' : (m === 'listening' ? 'Tap to stop' : 'Recite again'),
      showSay: say, sayLabel: say ? 'Hide how to say it' : 'Show how to say it',
      toggleSay: () => this.setState({ say: !say }),
      tapMic: () => this.setState({ mode: m === 'idle' ? 'listening' : (m === 'listening' ? 'result' : 'listening') })
    };
  }
}
</script>
